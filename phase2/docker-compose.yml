services:

  app:

    build:
      context: ./app

    container_name: observability-app-phase2

    ports:
      - "8000:8000"

    volumes:
      - app_logs:/logs

    networks:
      - observability


  elasticsearch:

    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0

    container_name: observability-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    networks:
      - observability


  logstash:

    image: docker.elastic.co/logstash/logstash:8.17.0

    container_name: observability-logstash

    ports:
      - "5044:5044"

    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro

    depends_on:
      - elasticsearch

    networks:
      - observability


  filebeat:

    image: docker.elastic.co/beats/filebeat:9.5.5
    
    container_name: observability-filebeat

    user: root
    command: ["--environment", "container", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - app_logs:/logs:ro

    depends_on:
      - logstash

    networks:
      - observability


  kibana:

    image: docker.elastic.co/kibana/kibana:8.17.0

    container_name: observability-kibana

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

    ports:
      - "5601:5601"

    depends_on:
      - elasticsearch

    networks:
      - observability

volumes:

  app_logs:

  elasticsearch_data:


networks:

  observability:

    driver: bridge