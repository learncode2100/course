global:
  scrape_interval: 30s

  evaluation_interval: 30s

scrape_configs:
  - job_name: "fastapi"

    static_configs:
      - targets:
          - "app:8000"

  - job_name: "testapi"

    static_configs:
      - targets:
          - "app:8000"

  - job_name: 'observability-app'
    static_configs:
      - targets: ['app:8000']

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:5000']