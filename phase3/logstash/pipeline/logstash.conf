input {
  beats {
    port => 5044
  }
}


filter {

  json {
    source => "message"
    target => "application"
  }

  mutate {

    add_field => {
      "service_name" => "%{[application][service]}"
      "environment_name" => "%{[application][environment]}"
      "log_level" => "%{[application][level]}"
      "http_method" => "%{[application][http_method]}"
      "http_path" => "%{[application][http_path]}"
      "http_status" => "%{[application][http_status]}"
      "duration_ms" => "%{[application][duration_ms]}"
    }

  }

  mutate {

    convert => {
      "http_status" => "integer"
      "duration_ms" => "float"
    }

  }

  if [http_status] >= 500 {

    mutate {
      add_field => {
        "severity_category" => "server_error"
      }
    }

  } else if [http_status] >= 400 {

    mutate {
      add_field => {
        "severity_category" => "client_error"
      }
    }

  } else {

    mutate {
      add_field => {
        "severity_category" => "success"
      }
    }

  }

}


output {

  elasticsearch {

    hosts => [
      "http://elasticsearch:9200"
    ]

    index => "observability-logs-%{+YYYY.MM.dd}"

  }

  stdout {
    codec => rubydebug
  }

}